spring.application.name=dan-hospital-api
server.port=${PORT:8080}
spring.datasource.url=${DAN_DB_URL:jdbc:h2:file:./data/mediflow}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DAN_DB_USERNAME:sa}
spring.datasource.password=${DAN_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=DAN Hospital Portal
